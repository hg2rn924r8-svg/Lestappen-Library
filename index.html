<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<style>
:root{
  --bg:#EDEAE1; --panel:#E3DFD2; --ink:#20241E; --ink-soft:#5B5F55;
  --accent:#7A3B32; --accent-soft:#9C6B54; --line:#C9C3B2;
  --serif:'Source Serif 4',Georgia,serif; --mono:'IBM Plex Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1D18; --panel:#242620; --ink:#EDEAE1; --ink-soft:#A9A796;
    --accent:#D08A6E; --accent-soft:#B37058; --line:#3A3C34;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1D18; --panel:#242620; --ink:#EDEAE1; --ink-soft:#A9A796;
  --accent:#D08A6E; --accent-soft:#B37058; --line:#3A3C34;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);height:100%}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:18px}
header h1{font-size:28px;letter-spacing:.2px}
header p{margin:4px 0 0;color:var(--ink-soft);font-size:14px}
.upload-btn{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:3px;font-size:14px;cursor:pointer;font-family:var(--sans)}
.upload-btn:hover{background:var(--accent-soft)}
#progress{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:8px}
.layout{display:flex;gap:26px;align-items:flex-start}
aside{width:230px;flex-shrink:0;position:sticky;top:20px}
aside section{margin-bottom:22px}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-family:var(--sans);font-weight:600;margin-bottom:8px}
.facet-list{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.facet-list label{display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}
.range-row{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px}
.range-row input{width:70px;padding:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:2px}
.clear-btn{font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline}
main{flex:1;min-width:0}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar input[type=search], .toolbar select{padding:9px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:3px;font-size:14px;font-family:var(--sans)}
.toolbar input[type=search]{flex:1;min-width:160px}
.count{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px}
.card h3{font-size:16px;line-height:1.25;margin-bottom:3px}
.card .author{font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.card .meta{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tag{font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:20px;color:var(--ink-soft)}
.tag.genre{border-color:var(--accent-soft);color:var(--accent)}
.card-actions{display:flex;gap:10px}
.card-actions button{font-size:12px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.edit-form{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.edit-form label{font-size:11px;color:var(--ink-soft)}
.edit-form input{padding:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:2px;font-size:13px;width:100%}
.edit-form .row{display:flex;gap:8px}
.edit-form .row button{flex:1;padding:6px;border:1px solid var(--line);background:var(--accent);color:#fff;border-radius:2px;cursor:pointer;font-size:12px}
.edit-form .row button.del{background:none;color:var(--accent);border-color:var(--accent)}
.empty{color:var(--ink-soft);font-size:14px;padding:40px 0;text-align:center;font-family:var(--serif);font-size:18px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
@media(max-width:760px){.layout{flex-direction:column}aside{width:100%;position:static}}
#readerOverlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column}
#readerOverlay.open{display:flex}
.reader-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.reader-bar h3{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-bar button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:7px 12px;cursor:pointer;font-size:13px;font-family:var(--sans)}
#readerArea{flex:1;position:relative;overflow:hidden}
#readerLoading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-family:var(--serif);font-size:16px;z-index:1;background:var(--bg)}
#readerLoading.hidden{display:none}
.reader-nav{position:absolute;top:0;bottom:0;width:15%;display:flex;align-items:center;z-index:2;background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:22px}
.reader-nav.prev{left:0;justify-content:flex-start;padding-left:6px}
.reader-nav.next{right:0;justify-content:flex-end;padding-right:6px}
</style>
</head>
<body>
<div id="readerOverlay">
  <div class="reader-bar">
    <h3 id="readerTitle"></h3>
    <button id="readerClose">Close</button>
  </div>
  <div id="readerArea">
    <div id="readerLoading">Loading book…</div>
    <button class="reader-nav prev" id="readerPrev">‹</button>
    <button class="reader-nav next" id="readerNext">›</button>
  </div>
</div>
<div class="wrap">
  <header>
    <div>
      <h1>Stacks</h1>
      <p>Your private epub archive — stored only in this browser.</p>
    </div>
    <div>
      <input type="file" id="fileInput" accept=".epub" multiple style="display:none">
      <button class="upload-btn" id="uploadBtn">Add epubs</button>
      <div id="progress"></div>
    </div>
  </header>
  <div class="layout">
    <aside>
      <section>
        <h3>Genre</h3>
        <div class="facet-list" id="genreFacets"></div>
      </section>
      <section>
        <h3>Tropes</h3>
        <div class="facet-list" id="tropeFacets"></div>
      </section>
      <section>
        <h3>Word count</h3>
        <div class="range-row">
          <input type="number" id="wcMin" placeholder="min">
          <span>–</span>
          <input type="number" id="wcMax" placeholder="max">
        </div>
      </section>
      <button class="clear-btn" id="clearFilters">Clear all filters</button>
      <button class="clear-btn" id="removeOld" style="display:block;margin-top:8px">Remove old-format books</button>
    </aside>
    <main>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search title or author…">
        <select id="sortSel">
          <option value="title-asc">Title A–Z</option>
          <option value="author-asc">Author A–Z</option>
          <option value="wc-desc">Word count: high–low</option>
          <option value="wc-asc">Word count: low–high</option>
          <option value="date-desc">Recently added</option>
        </select>
      </div>
      <div class="count" id="count"></div>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>
<script>
let library = [];
const filters = { genres: new Set(), tropes: new Set(), wcMin: null, wcMax: null, search: '', sort: 'title-asc' };

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('stacks-db', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('books', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbGetAll(){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('books', 'readonly').objectStore('books').getAll();
    tx.onsuccess = () => resolve(tx.result || []);
    tx.onerror = () => reject(tx.error);
  });
}
async function dbPut(book){
  try {
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('books', 'readwrite').objectStore('books').put(book);
      tx.onsuccess = resolve; tx.onerror = () => reject(tx.error);
    });
  } catch(e){ console.error('Could not save book to storage', e); }
}
async function dbDelete(id){
  try {
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('books', 'readwrite').objectStore('books').delete(id);
      tx.onsuccess = resolve; tx.onerror = () => reject(tx.error);
    });
  } catch(e){ console.error('Could not delete book from storage', e); }
}

function wordsOf(str){ return (str.match(/\S+/g) || []).length; }

function findEntry(zip, path){
  if (!path) return null;
  const candidates = [path, decodeURIComponent(path), encodeURI(path), path.replace(/^\.?\//, '')];
  for (const c of candidates) { const f = zip.file(c); if (f) return f; }
  // last resort: match by filename ignoring folder casing/prefixes
  const wanted = path.split('/').pop().toLowerCase();
  const all = zip.file(/.*/);
  return all.find(f => f.name.toLowerCase().endsWith(wanted)) || null;
}
function byLocalName(doc, name){
  return [...doc.getElementsByTagName('*')].filter(el => (el.localName || el.tagName.split(':').pop()) === name);
}

async function readFileWithRetry(file, attempts = 3){
  for (let i = 0; i < attempts; i++) {
    try { return await file.arrayBuffer(); }
    catch(e) {
      if (i === attempts - 1) throw e;
      await new Promise(r => setTimeout(r, 400 * (i + 1)));
    }
  }
}

async function parseEpub(file){
  const zip = await JSZip.loadAsync(await readFileWithRetry(file));
  const fallbackTitle = file.name.replace(/\.epub$/i, '');
  let title = fallbackTitle, author = 'Unknown', genre = '', wordCount = 0, hadError = false;

  try {
    const containerEntry = findEntry(zip, 'META-INF/container.xml');
    const containerXml = await containerEntry.async('string');
    const containerDoc = new DOMParser().parseFromString(containerXml, 'application/xml');
    const opfPath = byLocalName(containerDoc, 'rootfile')[0]?.getAttribute('full-path');
    const baseDir = opfPath && opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
    const opfEntry = findEntry(zip, opfPath);
    const opfXml = await opfEntry.async('string');
    const opfDoc = new DOMParser().parseFromString(opfXml, 'application/xml');

    try { title = byLocalName(opfDoc, 'title')[0]?.textContent?.trim() || fallbackTitle; } catch(e){}
    try { author = byLocalName(opfDoc, 'creator')[0]?.textContent?.trim() || 'Unknown'; } catch(e){}
    try { genre = byLocalName(opfDoc, 'subject')[0]?.textContent?.trim() || ''; } catch(e){}

    try {
      const manifest = {};
      for (const item of byLocalName(opfDoc, 'item')) manifest[item.getAttribute('id')] = item.getAttribute('href');
      for (const itemref of byLocalName(opfDoc, 'itemref')) {
        const href = manifest[itemref.getAttribute('idref')];
        if (!href) continue;
        const entry = findEntry(zip, baseDir + href);
        if (!entry) continue;
        try {
          const html = await entry.async('string');
          const text = new DOMParser().parseFromString(html, 'text/html').body?.textContent || '';
          wordCount += wordsOf(text);
        } catch(e) {}
      }
    } catch(e) { hadError = true; }
  } catch(e) {
    console.error('Epub parse error for', file.name, e);
    hadError = true;
  }
  return { id: crypto.randomUUID(), title, author, genre, tropes: [], wordCount, dateAdded: Date.now(), sourceFile: file.name, parseError: hadError && wordCount === 0, fileBlob: file };
}

document.getElementById('uploadBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = async (e) => {
  const files = [...e.target.files];
  const progress = document.getElementById('progress');
  for (let i = 0; i < files.length; i++) {
    progress.textContent = `Parsing ${i+1} of ${files.length}: ${files[i].name}`;
    let book;
    try {
      book = await parseEpub(files[i]);
    } catch(err) {
      if (err.name === 'AbortError') {
        console.error(`Failed to parse ${files[i].name}: the browser couldn't fully read this file after 3 tries. If it lives in a cloud-synced folder (OneDrive, Google Drive, iCloud Drive, Dropbox), make sure it's downloaded/available offline, or copy it somewhere fully local and try again.`);
      } else {
        console.error('Failed to parse', files[i].name, err);
      }
      book = { id: crypto.randomUUID(), title: files[i].name.replace(/\.epub$/i,''), author: 'Unknown', genre:'', tropes:[], wordCount:0, dateAdded: Date.now(), sourceFile: files[i].name, parseError:true, fileBlob: files[i] };
    }
    library.push(book);
    await dbPut(book);
    buildFacets(); render();
  }
  progress.textContent = '';
  e.target.value = '';
};

function buildFacets(){
  const genres = new Set(), tropes = new Set();
  library.forEach(b => { if (b.genre) genres.add(b.genre); (b.tropes||[]).forEach(t => tropes.add(t)); });
  const buildList = (el, set, targetSet) => {
    el.innerHTML = '';
    [...set].sort().forEach(val => {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = targetSet.has(val);
      cb.onchange = () => { cb.checked ? targetSet.add(val) : targetSet.delete(val); render(); };
      label.appendChild(cb);
      label.appendChild(document.createTextNode(val));
      el.appendChild(label);
    });
  };
  buildList(document.getElementById('genreFacets'), genres, filters.genres);
  buildList(document.getElementById('tropeFacets'), tropes, filters.tropes);
}

document.getElementById('search').oninput = e => { filters.search = e.target.value.toLowerCase(); render(); };
document.getElementById('sortSel').onchange = e => { filters.sort = e.target.value; render(); };
document.getElementById('wcMin').oninput = e => { filters.wcMin = e.target.value ? +e.target.value : null; render(); };
document.getElementById('wcMax').oninput = e => { filters.wcMax = e.target.value ? +e.target.value : null; render(); };
document.getElementById('clearFilters').onclick = () => {
  filters.genres.clear(); filters.tropes.clear(); filters.wcMin = null; filters.wcMax = null;
  document.getElementById('wcMin').value = ''; document.getElementById('wcMax').value = '';
  buildFacets(); render();
};
document.getElementById('removeOld').onclick = async () => {
  const stale = library.filter(b => !b.fileBlob);
  if (!stale.length) { alert('No old-format books found — everything already has a saved file.'); return; }
  if (!confirm(`Remove ${stale.length} book(s) that don't have a saved file? You can re-upload them anytime to add them back with reading enabled.`)) return;
  for (const b of stale) await dbDelete(b.id);
  library = library.filter(b => b.fileBlob);
  buildFacets(); render();
};

function editForm(book){
  return `<div class="edit-form">
    <label>Genre</label><input data-f="genre" value="${escAttr(book.genre)}">
    <label>Tropes (comma separated)</label><input data-f="tropes" value="${escAttr((book.tropes||[]).join(', '))}">
    <div class="row"><button data-act="save">Save</button><button class="del" data-act="form-delete">Delete</button></div>
  </div>`;
}
function escAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }
function escHtml(s){ return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function render(){
  let list = library.filter(b => {
    if (filters.search && !(b.title.toLowerCase().includes(filters.search) || b.author.toLowerCase().includes(filters.search))) return false;
    if (filters.genres.size && !filters.genres.has(b.genre)) return false;
    if (filters.tropes.size && ![...filters.tropes].every(t => (b.tropes||[]).includes(t))) return false;
    if (filters.wcMin != null && b.wordCount < filters.wcMin) return false;
    if (filters.wcMax != null && b.wordCount > filters.wcMax) return false;
    return true;
  });
  const sorters = {
    'title-asc': (a,b) => a.title.localeCompare(b.title),
    'author-asc': (a,b) => a.author.localeCompare(b.author),
    'wc-desc': (a,b) => b.wordCount - a.wordCount,
    'wc-asc': (a,b) => a.wordCount - b.wordCount,
    'date-desc': (a,b) => b.dateAdded - a.dateAdded,
  };
  list.sort(sorters[filters.sort]);

  document.getElementById('count').textContent = `${list.length} of ${library.length} books`;
  const grid = document.getElementById('grid');
  if (!library.length) {
    grid.innerHTML = '<div class="empty">Your shelf is empty. Add some epubs to begin.</div>';
    return;
  }
  if (!list.length) {
    grid.innerHTML = '<div class="empty">Nothing matches these filters.</div>';
    return;
  }
  grid.innerHTML = list.map(b => `
    <div class="card" data-id="${b.id}">
      <h3>${escHtml(b.title)}</h3>
      <div class="author">${escHtml(b.author)}</div>
      <div class="meta">${b.wordCount.toLocaleString()} words${b.parseError ? ' · parse incomplete' : ''}</div>
      <div class="tags">
        ${b.genre ? `<span class="tag genre">${escHtml(b.genre)}</span>` : ''}
        ${(b.tropes||[]).map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}
      </div>
      <div class="card-actions">
        ${b.fileBlob ? '<button data-act="read">Read</button>' : ''}
        <button data-act="edit">Edit tags</button>
        <button data-act="delete">Delete</button>
      </div>
    </div>`).join('');

  grid.querySelectorAll('[data-act="read"]').forEach(btn => {
    btn.onclick = () => openReader(library.find(b => b.id === btn.closest('.card').dataset.id));
  });
  async function deleteBook(id){
    if (!confirm('Remove this book from your shelf?')) return;
    await dbDelete(id);
    library = library.filter(b => b.id !== id);
    buildFacets(); render();
  }
  grid.querySelectorAll('.card-actions > [data-act="delete"]').forEach(btn => {
    btn.onclick = () => deleteBook(btn.closest('.card').dataset.id);
  });
  grid.querySelectorAll('[data-act="edit"]').forEach(btn => {
    btn.onclick = () => {
      const card = btn.closest('.card');
      if (card.querySelector('.edit-form')) { card.querySelector('.edit-form').remove(); return; }
      card.insertAdjacentHTML('beforeend', editForm(library.find(b => b.id === card.dataset.id)));
      card.querySelector('[data-act="save"]').onclick = async () => {
        const book = library.find(b => b.id === card.dataset.id);
        book.genre = card.querySelector('[data-f="genre"]').value.trim();
        book.tropes = card.querySelector('[data-f="tropes"]').value.split(',').map(s => s.trim()).filter(Boolean);
        await dbPut(book); buildFacets(); render();
      };
      card.querySelector('[data-act="form-delete"]').onclick = () => deleteBook(card.dataset.id);
    };
  });
}

let currentBook = null, currentRendition = null, readerReady = false;
async function openReader(book){
  if (!book.fileBlob) { alert("This book's original file wasn't kept, so it can't be reopened for reading — try re-adding it."); return; }
  readerReady = false;
  document.getElementById('readerTitle').textContent = book.title;
  document.getElementById('readerOverlay').classList.add('open');
  document.getElementById('readerLoading').classList.remove('hidden');
  try {
    currentBook = ePub(await book.fileBlob.arrayBuffer());
    currentRendition = currentBook.renderTo('readerArea', { width: '100%', height: '100%', flow: 'paginated', spread: 'auto' });
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 15000));
    await Promise.race([currentRendition.display(), timeout]);
    readerReady = true;
    document.getElementById('readerLoading').classList.add('hidden');
  } catch(e) {
    if (e.message === 'timeout') {
      console.error('Reader timed out opening', book.title, '— book state:', currentBook);
      alert("This book is taking too long to load and may not be fully supported by the reader. Check the console for details, or try a different book.");
    } else {
      console.error('Reader failed to open', e);
      alert("Sorry, this book couldn't be opened for reading — it may use a format the reader doesn't support.");
    }
    closeReader();
  }
}
function closeReader(){
  readerReady = false;
  document.getElementById('readerOverlay').classList.remove('open');
  document.getElementById('readerLoading').classList.remove('hidden');
  try { currentRendition?.destroy(); currentBook?.destroy(); } catch(e){}
  currentRendition = null; currentBook = null;
}
function goPrev(){ if (readerReady) try { currentRendition.prev(); } catch(e){ console.error(e); } }
function goNext(){ if (readerReady) try { currentRendition.next(); } catch(e){ console.error(e); } }
document.getElementById('readerClose').onclick = closeReader;
document.getElementById('readerPrev').onclick = goPrev;
document.getElementById('readerNext').onclick = goNext;
document.addEventListener('keydown', e => {
  if (!document.getElementById('readerOverlay').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'Escape') closeReader();
});

(async function init(){
  try {
    library = await dbGetAll();
    if (!library.length) {
      let old = [];
      try { old = JSON.parse(localStorage.getItem('stacks-library-v1') || '[]'); } catch(e){}
      if (old.length) {
        for (const b of old) await dbPut(b);
        library = old;
      }
    }
  } catch(e){ console.error('Could not load library from storage', e); library = []; }
  buildFacets(); render();
})();
</script>
</body>
</html>
